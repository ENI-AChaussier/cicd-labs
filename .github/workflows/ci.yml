name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . --output-format=github

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage and JUnit output
        run: |
          mkdir -p reports
          pytest -m "unit or api" -n auto \
            --cov=minishop \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=85 \
            --junitxml=reports/junit.xml
      - name: Publish coverage summary
        if: always()
        run: |
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.python-version }}
          path: |
            reports/
            htmlcov/

  test-container:
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "unit or api" -n auto

  docker-smoke:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t minishop:test .
      - name: Run container
        run: |
          docker run -d --rm -p 8000:8000 --name minishop-test minishop:test
          sleep 5
      - name: Smoke test health endpoint
        run: curl -fsS http://localhost:8000/health
      - name: Stop container
        if: always()
        run: docker rm -f minishop-test || true