name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check . --output-format=github     # annotations dans la PR
      - run: ruff format --check .

  unit:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
     
      - name: Tests unitaires + API en parallèle (xdist)
        run: >
          pytest -m "unit or api" -n auto
          --cov --cov-report=xml --cov-report=html --cov-fail-under=85
          --junitxml=reports/junit-${{ matrix.python }}.xml
      # Conserver les rapports générés par les tests    
      - uses: actions/upload-artifact@v4
        if: always()                                   # même si les tests échouent
        with:
          name: test-reports-${{ matrix.python }}     # un artefact par version de Python
          #Fichiers des rapports JUnit des tests et HTML, XML de couverture
          path: |
            reports/
            htmlcov/
            coverage.xml
       # Afficher le résumé de couverture dans GitHub Actions      
      - name: Résumé dans la page du run
        if: always() && matrix.python == '3.12'        # Uniquement pour Python 3.12
        run: |
          echo "### Couverture" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"